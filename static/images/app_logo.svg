<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- App Badge Gradients (Facebook-inspired deep royal blue transitioning to rich Islamic emerald) -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2" />
      <stop offset="35%" stop-color="#0e5fb8" />
      <stop offset="75%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Glossy top reflection highlight -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Luxurious Metallic Gold Gradient for Calligraphy & Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="25%" stop-color="#FDD835" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Pearl Bead Radial Gradient with Realistic Light Shading -->
    <radialGradient id="pearlBead" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef3c7" />
      <stop offset="55%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <!-- Ruby / Emerald Accent Bead Gradient -->
    <radialGradient id="emeraldBead" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="85%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="beadShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Icon: Facebook-style Modern Squircle (Rounded Square) -->
  <rect x="25" y="25" width="450" height="450" rx="98" ry="98" fill="url(#badgeGrad)" filter="url(#badgeShadow)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.25" />

  <!-- Inner Subtle Border Accent -->
  <rect x="36" y="36" width="428" height="428" rx="88" ry="88" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.35" />

  <!-- Glossy Glass Arc Reflection (Iconic 3D app shine) -->
  <path d="M 35 125 C 35 75, 75 35, 125 35 L 375 35 C 425 35, 465 75, 465 125 C 465 180, 380 230, 250 230 C 120 230, 35 180, 35 125 Z" fill="url(#glassGloss)" />

  <!-- Center Emblem: Holy Quran on Traditional Wooden Rehal (Golden Glow) -->
  <g transform="translate(0, 10)">
    <!-- Crescent Moon Ambient Backdrop -->
    <path d="M 280 115 A 115 115 0 1 0 355 260 A 90 90 0 1 1 280 115 Z" fill="url(#goldGrad)" opacity="0.18" filter="url(#softGlow)" />

    <!-- Quran Rehal (Book Stand) -->
    <path d="M 180 345 L 250 290 L 320 345 L 340 330 L 250 262 L 160 330 Z" fill="url(#goldGrad)" filter="url(#beadShadow)" />
    <path d="M 250 262 L 236 280 L 264 280 Z" fill="#78350f" />

    <!-- Open Quran Pages -->
    <!-- Left Page -->
    <path d="M 248 180 C 205 165 155 174 130 188 C 125 228 128 272 135 296 C 168 282 218 272 248 282 Z" fill="#fffef7" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Right Page -->
    <path d="M 252 180 C 295 165 345 174 370 188 C 375 228 372 272 365 296 C 332 282 282 272 252 282 Z" fill="#fffef7" stroke="url(#goldGrad)" stroke-width="3" />

    <!-- Page Center Seam & Gold Bookmark Ribbon -->
    <line x1="250" y1="178" x2="250" y2="284" stroke="url(#goldGrad)" stroke-width="3.5" />
    <path d="M 250 282 Q 255 315 260 335 L 254 330 L 248 335 Z" fill="#dc2626" />

    <!-- Calligraphy Lines on Quran Pages -->
    <path d="M 150 210 C 175 202 210 206 234 214 M 150 232 C 175 224 210 228 234 236 M 150 254 C 175 246 210 250 234 258" stroke="#065f46" stroke-width="2.8" stroke-linecap="round" opacity="0.85" />
    <path d="M 266 214 C 290 206 325 202 350 210 M 266 236 C 290 228 325 224 350 232 M 266 258 C 290 250 325 246 350 254" stroke="#065f46" stroke-width="2.8" stroke-linecap="round" opacity="0.85" />

    <!-- Radiant Islamic Noor Star (8-Point) -->
    <g transform="translate(250, 130) scale(0.65)">
      <polygon points="0,-36 9,-11 34,-11 14,5 22,30 0,16 -22,30 -14,5 -34,-11 -9,-11" fill="url(#goldGrad)" filter="url(#softGlow)" />
      <circle cx="0" cy="0" r="8" fill="#047857" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- THE TASBIH (تسبیح - Prayer Beads Draped Gracefully)      -->
  <!-- Drapes from upper right corner across the app badge      -->
  <!-- ======================================================== -->
  <g id="tasbih" filter="url(#beadShadow)">
    <!-- Silk Connecting Cord / Thread -->
    <path d="M 390 55 C 440 90, 460 160, 445 230 C 430 300, 395 365, 330 405 C 265 445, 175 440, 115 390 C 70 350, 65 290, 85 240 C 105 190, 150 150, 195 125" fill="none" stroke="#78350f" stroke-width="2.5" opacity="0.6" />

    <!-- Tasbih Beads along the Curve with Realistic Pearl Highlights -->
    <!-- Bead 1 -->
    <circle cx="395" cy="65" r="11" fill="url(#pearlBead)" />
    <!-- Bead 2 -->
    <circle cx="415" cy="85" r="11" fill="url(#pearlBead)" />
    <!-- Bead 3 -->
    <circle cx="430" cy="110" r="11" fill="url(#pearlBead)" />
    <!-- Bead 4 -->
    <circle cx="442" cy="138" r="11" fill="url(#pearlBead)" />
    <!-- Bead 5 -->
    <circle cx="450" cy="168" r="11" fill="url(#pearlBead)" />
    <!-- Bead 6 (Emerald Marker Bead) -->
    <circle cx="452" cy="198" r="12" fill="url(#emeraldBead)" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Bead 7 -->
    <circle cx="446" cy="228" r="11" fill="url(#pearlBead)" />
    <!-- Bead 8 -->
    <circle cx="434" cy="258" r="11" fill="url(#pearlBead)" />
    <!-- Bead 9 -->
    <circle cx="416" cy="286" r="11" fill="url(#pearlBead)" />
    <!-- Bead 10 -->
    <circle cx="394" cy="312" r="11" fill="url(#pearlBead)" />
    <!-- Bead 11 -->
    <circle cx="368" cy="336" r="11" fill="url(#pearlBead)" />
    <!-- Bead 12 (Emerald Marker Bead) -->
    <circle cx="340" cy="358" r="12" fill="url(#emeraldBead)" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Bead 13 -->
    <circle cx="310" cy="378" r="11" fill="url(#pearlBead)" />
    <!-- Bead 14 -->
    <circle cx="278" cy="394" r="11" fill="url(#pearlBead)" />
    <!-- Bead 15 -->
    <circle cx="245" cy="405" r="11" fill="url(#pearlBead)" />
    <!-- Bead 16 -->
    <circle cx="210" cy="410" r="11" fill="url(#pearlBead)" />
    <!-- Bead 17 -->
    <circle cx="175" cy="408" r="11" fill="url(#pearlBead)" />
    <!-- Bead 18 (Emerald Marker Bead) -->
    <circle cx="142" cy="398" r="12" fill="url(#emeraldBead)" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Bead 19 -->
    <circle cx="114" cy="378" r="11" fill="url(#pearlBead)" />
    <!-- Bead 20 -->
    <circle cx="92" cy="352" r="11" fill="url(#pearlBead)" />
    <!-- Bead 21 -->
    <circle cx="78" cy="320" r="11" fill="url(#pearlBead)" />
    <!-- Bead 22 -->
    <circle cx="74" cy="286" r="11" fill="url(#pearlBead)" />
    <!-- Bead 23 -->
    <circle cx="80" cy="252" r="11" fill="url(#pearlBead)" />
    <!-- Bead 24 (Emerald Marker Bead) -->
    <circle cx="96" cy="222" r="12" fill="url(#emeraldBead)" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Bead 25 -->
    <circle cx="120" cy="196" r="11" fill="url(#pearlBead)" />
    <!-- Bead 26 -->
    <circle cx="148" cy="174" r="11" fill="url(#pearlBead)" />
    <!-- Bead 27 -->
    <circle cx="180" cy="158" r="11" fill="url(#pearlBead)" />

    <!-- ======================================================== -->
    <!-- TASBIH IMAM / MINARET BEAD & SILK TASSEL (فندوشہ / جھالر) -->
    <!-- At upper right where tasbih joins                       -->
    <!-- ======================================================== -->
    <!-- Connector Bead -->
    <circle cx="376" cy="48" r="12" fill="url(#emeraldBead)" stroke="url(#goldGrad)" stroke-width="1.8" />
    <!-- Elongated Minaret Imam (Main Tasbih Spire) -->
    <path d="M 368 40 L 384 40 L 381 12 Q 376 4 371 12 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1" />
    <circle cx="376" cy="6" r="4.5" fill="url(#pearlBead)" />

    <!-- Silk Cord hanging from Imam -->
    <path d="M 376 40 Q 360 48 350 62" fill="none" stroke="#f59e0b" stroke-width="3" />

    <!-- Gold Tassel Cap (Tosh) -->
    <path d="M 342 62 Q 350 56 358 62 L 356 70 Q 350 72 344 70 Z" fill="url(#goldGrad)" />
    <!-- Tassel Threads / Fringe -->
    <path d="M 344 70 Q 338 90 334 105" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <path d="M 347 71 Q 343 93 340 108" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
    <path d="M 350 72 Q 350 94 348 110" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" />
    <path d="M 353 71 Q 356 93 357 108" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <path d="M 356 70 Q 362 90 365 105" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>