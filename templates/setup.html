{% extends "base.html" %}

{% block title %}Setup Teacher Account | {{ app_name }}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 via-slate-900 to-slate-950">
    <div class="max-w-md w-full glass-dark text-white rounded-2xl p-8 shadow-2xl border border-indigo-500/30">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/30 text-indigo-400 border border-indigo-500/40 mb-4 shadow-lg">
                <i class="fa-solid fa-chalkboard-user text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Initial Setup: Teacher Account</h1>
            <p class="text-sm text-slate-400 mt-2">
                This platform is configured for <strong class="text-indigo-300">1 Teacher</strong> who operates as the sole Administrator and Instructor.
            </p>
        </div>

        <!-- Alert Message Container -->
        <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

        <!-- Setup Form -->
        <form id="setupForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Full Name</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-regular fa-user"></i></span>
                    <input type="text" id="fullName" required placeholder="e.g. Professor Ahmad Ali"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-solid fa-at"></i></span>
                    <input type="text" id="username" required placeholder="e.g. teacher1"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-regular fa-envelope"></i></span>
                    <input type="email" id="email" required placeholder="teacher@example.com"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Phone Number (Optional)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-solid fa-phone"></i></span>
                    <input type="text" id="phone" placeholder="+92 300 1234567"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" required minlength="6" placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Confirm Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-solid fa-shield-halved"></i></span>
                    <input type="password" id="confirmPassword" required minlength="6" placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full mt-6 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-white shadow-lg shadow-indigo-600/30 transition duration-200 flex items-center justify-center gap-2">
                <span>Create Teacher Account & Launch</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const form = document.getElementById('setupForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('fullName').value.trim();
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            showAlert('Passwords do not match!', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Setting up account...';

        try {
            const res = await fetch('/api/auth/setup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    full_name: fullName,
                    username: username,
                    email: email,
                    phone_number: phone,
                    password: password
                })
            });

            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.detail || 'Failed to complete setup');
            }

            showAlert('Teacher account created successfully! Logging you in...', 'success');
            
            // Auto-login
            const loginRes = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username_or_email: username,
                    password: password
                })
            });

            if (loginRes.ok) {
                window.location.href = '/dashboard';
            } else {
                window.location.href = '/login';
            }
        } catch (err) {
            showAlert(err.message, 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Create Teacher Account & Launch</span> <i class="fa-solid fa-arrow-right"></i>';
        }
    });

    function showAlert(msg, type) {
        alertBox.className = type === 'error' 
            ? 'mb-6 p-4 rounded-xl text-sm font-medium bg-red-500/20 text-red-200 border border-red-500/30'
            : 'mb-6 p-4 rounded-xl text-sm font-medium bg-emerald-500/20 text-emerald-200 border border-emerald-500/30';
        alertBox.textContent = msg;
        alertBox.classList.remove('hidden');
    }
</script>
{% endblock %}
